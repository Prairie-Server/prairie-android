name: Android Builds

# CI gate: :shared debug unit tests + Kover line-coverage verify (commonMain).
# Floor is 95% line coverage across commonMain (androidMain / Koin / serializers
# excluded — see shared/build.gradle.kts). App-module unit tests (androidApp /
# androidTvApp / android-shared) are not part of this gate and are skipped here
# to keep the longest client CI focused on the shared coverage contract.
# Release artifacts (Play Store bundles, sideload APKs, GitHub releases) are
# owned by release.yml — triggered by v* tags or its workflow_dispatch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run :shared unit tests and coverage gate
        shell: bash
        run: |
          set -euo pipefail

          # Only :shared debug unit tests feed the Kover commonMain gate.
          # Release unit tests are disabled on :shared (see build.gradle.kts).
          # App modules are intentionally out of this job.
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :shared:testDebugUnitTest \
            :shared:koverXmlReport \
            :shared:koverVerify \
            --max-workers=4 \
            --no-configuration-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-reports
          path: |
            **/build/reports/kover/**
          if-no-files-found: ignore
