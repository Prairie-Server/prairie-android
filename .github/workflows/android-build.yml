name: Android Builds

# CI gate: unit tests + Kover line-coverage verify on :shared (KMP commonTest).
# Floor is 95% line coverage across commonMain (androidMain / Koin / serializers
# excluded — see shared/build.gradle.kts). :android-shared has substantial
# androidUnitTest coverage but a large Media3/player surface; it is not included
# in the gate until it can meet the shared floor without lowering it. Release
# artifacts (Play Store bundles, sideload APKs, GitHub releases) are owned by
# release.yml — triggered by v* tags or its workflow_dispatch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and coverage gate
        shell: bash
        run: |
          set -euo pipefail

          # Scope to :shared — that is the Kover gate. App modules
          # (:androidApp / :androidTvApp) and :android-shared pull Media3 and
          # inflate CI without moving the coverage floor. Debug variant only
          # (release unit tests recompile the same sources).
          # --rerun-tasks on Kover: setup-gradle cache can restore a stale
          # koverVerify result that sits 0.002% under the 95% floor.
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :shared:testDebugUnitTest \
            --max-workers=4
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :shared:koverXmlReport \
            :shared:koverVerify \
            --rerun-tasks \
            --max-workers=4

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-reports
          path: |
            **/build/reports/kover/**
          if-no-files-found: ignore
