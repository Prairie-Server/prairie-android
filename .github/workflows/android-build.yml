name: Android Builds

# CI gate: unit tests + Kover line-coverage verify on :shared (KMP commonTest).
# Floor is 90% line coverage across commonMain (androidMain / Koin / serializers
# excluded — see shared/build.gradle.kts). :android-shared has substantial
# androidUnitTest coverage but a large Media3/player surface; it is not included
# in the gate until it can meet the shared floor without lowering it. Release
# artifacts (Play Store bundles, sideload APKs, GitHub releases) are owned by
# release.yml — triggered by v* tags or its workflow_dispatch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and coverage gate
        shell: bash
        run: |
          set -euo pipefail

          # Debug-variant unit tests only. The release variant compiles and runs
          # the exact same sources for no extra signal, and doubles CI time.
          # Then :shared Kover report + verify (commonTest runs under the
          # androidTarget JVM test task).
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            testDebugUnitTest \
            :shared:koverXmlReport \
            :shared:koverVerify \
            --max-workers=4 \
            --configuration-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-reports
          path: |
            **/build/reports/kover/**
          if-no-files-found: ignore
