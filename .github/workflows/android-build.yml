name: Android Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional app version for manual builds, e.g. v0.2.0"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android phone debug APK
            module: androidApp
            artifact-name: android-phone-debug-apks
            apk-path: androidApp/build/outputs/apk/debug/*.apk
          - name: Android TV debug APK
            module: androidTvApp
            artifact-name: android-tv-debug-apks
            apk-path: androidTvApp/build/outputs/apk/debug/*.apk

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve app version
        shell: bash
        run: |
          set -euo pipefail

          version_name="${{ github.event.inputs.version_name }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "${version_name}" ]]; then
            echo "No tag or manual version supplied; using Gradle defaults."
            exit 0
          fi

          version_name="${version_name#v}"
          if [[ ! "${version_name}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3 or 1.2.3."
            exit 1
          fi

          base_version="${version_name%%[-+]*}"
          IFS=. read -r major minor patch <<< "${base_version}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          if (( version_code <= 0 )); then
            echo "::error::Version code must be positive."
            exit 1
          fi

          {
            echo "SILO_VERSION_NAME=${version_name}"
            echo "SILO_VERSION_CODE=${version_code}"
          } >> "${GITHUB_ENV}"

          echo "Resolved app version ${version_name} (${version_code})."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          args=(":${{ matrix.module }}:assembleDebug")
          if [[ -n "${SILO_VERSION_NAME:-}" ]]; then
            args+=(
              "-PsiloVersionName=${SILO_VERSION_NAME}"
              "-PsiloVersionCode=${SILO_VERSION_CODE}"
            )
          fi

          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            "${args[@]}" \
            --max-workers=2

      - name: Upload debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.apk-path }}
          if-no-files-found: error
