name: Android Builds

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional app version for manual builds, e.g. v0.2.0"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            test \
            --max-workers=2

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore

  build-release:
    name: ${{ matrix.name }}
    # APKs are only assembled for releases (tags) and manual runs; PR and
    # main pushes are gated by unit-tests alone.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android phone release APK
            module: androidApp
            artifact-name: android-phone-release-apks
            apk-path: androidApp/build/outputs/apk/release/*.apk
            release-prefix: silo-android
          - name: Android TV release APK
            module: androidTvApp
            artifact-name: android-tv-release-apks
            apk-path: androidTvApp/build/outputs/apk/release/*.apk
            release-prefix: silo-android-tv

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve app version
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          set -euo pipefail

          version_name="${INPUT_VERSION_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "${version_name}" ]]; then
            echo "No tag or manual version supplied; using Gradle defaults."
            exit 0
          fi

          version_name="${version_name#v}"
          if [[ ! "${version_name}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3 or 1.2.3."
            exit 1
          fi

          base_version="${version_name%%[-+]*}"
          IFS=. read -r major minor patch <<< "${base_version}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))

          if (( version_code <= 0 )); then
            echo "::error::Version code must be positive."
            exit 1
          fi

          {
            echo "SILO_VERSION_NAME=${version_name}"
            echo "SILO_VERSION_CODE=${version_code}"
          } >> "${GITHUB_ENV}"

          echo "Resolved app version ${version_name} (${version_code})."

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SILO_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "::error::SILO_RELEASE_KEYSTORE_B64 secret is not set."
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/silo-release.jks"
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${keystore_path}"
          echo "SILO_RELEASE_KEYSTORE=${keystore_path}" >> "${GITHUB_ENV}"

      # Optional: FCM config for push notifications. The app degrades
      # gracefully without it (push registration is skipped), but release
      # builds should ship with push working. Encode with:
      #   base64 < androidApp/google-services.json | tr -d '\n'
      - name: Decode google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.SILO_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail

          if [[ -z "${GOOGLE_SERVICES_B64}" ]]; then
            echo "::warning::SILO_GOOGLE_SERVICES_JSON_B64 is not set; building without FCM push support."
            exit 0
          fi

          printf '%s' "${GOOGLE_SERVICES_B64}" | base64 -d > androidApp/google-services.json
          echo "Wrote androidApp/google-services.json."

      - name: Build release APK
        shell: bash
        env:
          SILO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SILO_RELEASE_KEYSTORE_PASSWORD }}
          SILO_RELEASE_KEY_PASSWORD: ${{ secrets.SILO_RELEASE_KEY_PASSWORD }}
          SILO_RELEASE_KEY_ALIAS: ${{ secrets.SILO_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          args=(":${{ matrix.module }}:assembleRelease")
          if [[ -n "${SILO_VERSION_NAME:-}" ]]; then
            args+=(
              "-PsiloVersionName=${SILO_VERSION_NAME}"
              "-PsiloVersionCode=${SILO_VERSION_CODE}"
            )
          fi

          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            "${args[@]}" \
            --max-workers=2

      - name: Collect release APKs
        shell: bash
        run: |
          set -euo pipefail

          version_label="${SILO_VERSION_NAME:-dev}"
          artifact_dir="release-artifacts/${{ matrix.artifact-name }}"
          mkdir -p "${artifact_dir}"

          for apk in ${{ matrix.apk-path }}; do
            apk_name="$(basename "${apk}")"
            variant="${apk_name#${{ matrix.module }}-}"
            cp "${apk}" "${artifact_dir}/${{ matrix.release-prefix }}-${version_label}-${variant}"

            if [[ "${variant}" == "universal-release.apk" ]]; then
              cp "${apk}" "${artifact_dir}/${{ matrix.release-prefix }}-latest-${variant}"
              # The Downloader by AFTVnews short codes redirect to the old
              # debug-named asset URL. Keep publishing the release build under
              # that filename until the aftv.news codes are re-registered.
              cp "${apk}" "${artifact_dir}/${{ matrix.release-prefix }}-latest-universal-debug.apk"
            fi
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: release-artifacts/${{ matrix.artifact-name }}/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: android-*-release-apks
          path: release-artifacts

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          release_tag="${GITHUB_REF_NAME}"
          release_title="Silo Android ${release_tag}"
          android_latest_url="https://github.com/${GH_REPO}/releases/latest/download/silo-android-latest-universal-release.apk"
          android_tv_latest_url="https://github.com/${GH_REPO}/releases/latest/download/silo-android-tv-latest-universal-release.apk"
          android_downloader_url="http://aftv.news/1051382"
          android_tv_downloader_url="http://aftv.news/1636227"
          release_notes="$(cat <<EOF
          Release APK builds for ${release_tag}.

          Note: builds are now release-signed. Updating from an older
          debug-signed install requires uninstalling the app once.

          Install with Downloader by AFTVnews:

          Android:
          Code 1051382
          ${android_downloader_url}

          Android TV:
          Code 1636227
          ${android_tv_downloader_url}

          Latest Android APK:
          ${android_latest_url}

          Latest Android TV APK:
          ${android_tv_latest_url}
          EOF
          )"
          apk_files=(release-artifacts/**/*.apk)

          if (( ${#apk_files[@]} == 0 )); then
            echo "::error::No APK files were downloaded for release upload."
            exit 1
          fi

          if ! gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release create "${release_tag}" \
              --title "${release_title}" \
              --notes "${release_notes}"
          else
            gh release edit "${release_tag}" \
              --title "${release_title}" \
              --notes "${release_notes}"
          fi

          gh release upload "${release_tag}" "${apk_files[@]}" --clobber
