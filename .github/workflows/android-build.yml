name: Android Builds

# CI gate: unit tests + Kover 75% line coverage verify on :shared (KMP commonTest).
# :android-shared has substantial androidUnitTest coverage but a large Media3/player
# surface; it is not included in the gate until it can meet 75% without lowering it.
# Release artifacts (Play Store bundles, sideload APKs, GitHub releases) are owned
# by release.yml — triggered by v* tags or its workflow_dispatch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and coverage gate
        shell: bash
        run: |
          set -euo pipefail

          # All modules' unit tests first, then :shared Kover report + 75% verify
          # (commonTest runs under the androidTarget JVM test task).
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            test \
            :shared:koverXmlReport \
            :shared:koverVerify \
            --max-workers=2

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: kover-coverage-reports
          path: |
            **/build/reports/kover/**
          if-no-files-found: ignore
